<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#3974a8"/></marker><style>.title{font:700 36px Arial;fill:#17324d}.sub{font:400 18px Arial;fill:#52687c}.box{fill:#eef5ff;stroke:#3974a8;stroke-width:3}.build{fill:#f4effb;stroke:#7656a8;stroke-width:3}.eval{fill:#edf8f3;stroke:#3b8b6d;stroke-width:3}.n{font:700 20px Arial;fill:white}.c1{fill:#3974a8}.c2{fill:#7656a8}.c3{fill:#3b8b6d}.h{font:700 22px Arial;fill:#17324d}.t{font:400 16px Arial;fill:#334e63}.line{stroke:#3974a8;stroke-width:3;fill:none;marker-end:url(#a)}.group{font:700 17px Arial;fill:#52687c;letter-spacing:1px}</style></defs>
  <rect width="1800" height="920" fill="white"/><text x="900" y="58" text-anchor="middle" class="title">Metodología de la investigación</text><text x="900" y="90" text-anchor="middle" class="sub">Seis fases conectadas desde la preparación del caso hasta la evaluación de resultados</text>

  <text x="100" y="160" class="group">FUNDAMENTACIÓN Y DISEÑO</text>
  <g transform="translate(100,195)"><rect width="430" height="180" rx="22" class="box"/><circle cx="48" cy="48" r="27" class="c1"/><text x="48" y="55" text-anchor="middle" class="n">1</text><text x="215" y="83" text-anchor="middle" class="h">Preparación del caso</text><text x="215" y="118" text-anchor="middle" class="t">corpus sintético controlado</text><text x="215" y="145" text-anchor="middle" class="t">y protocolo de investigación</text></g>
  <g transform="translate(685,195)"><rect width="430" height="180" rx="22" class="box"/><circle cx="48" cy="48" r="27" class="c1"/><text x="48" y="55" text-anchor="middle" class="n">2</text><text x="215" y="83" text-anchor="middle" class="h">Diseño arquitectónico</text><text x="215" y="118" text-anchor="middle" class="t">agentes, roles, flujos</text><text x="215" y="145" text-anchor="middle" class="t">contratos y decisiones</text></g>
  <g transform="translate(1270,195)"><rect width="430" height="180" rx="22" class="box"/><circle cx="48" cy="48" r="27" class="c1"/><text x="48" y="55" text-anchor="middle" class="n">3</text><text x="215" y="83" text-anchor="middle" class="h">Definición del proceso</text><text x="215" y="118" text-anchor="middle" class="t">etapas, entradas, salidas</text><text x="215" y="145" text-anchor="middle" class="t">controles y medidas</text></g>
  <path d="M530 285 H685" class="line"/><path d="M1115 285 H1270" class="line"/>

  <text x="100" y="505" class="group">CONSTRUCCIÓN Y EVALUACIÓN</text>
  <g transform="translate(1270,540)"><rect width="430" height="180" rx="22" class="build"/><circle cx="48" cy="48" r="27" class="c2"/><text x="48" y="55" text-anchor="middle" class="n">4</text><text x="215" y="83" text-anchor="middle" class="h">Implementación</text><text x="215" y="118" text-anchor="middle" class="t">prototipo web ReqLab</text><text x="215" y="145" text-anchor="middle" class="t">y pruebas técnicas</text></g>
  <g transform="translate(685,540)"><rect width="430" height="180" rx="22" class="eval"/><circle cx="48" cy="48" r="27" class="c3"/><text x="48" y="55" text-anchor="middle" class="n">5</text><text x="215" y="83" text-anchor="middle" class="h">Ejecución comparativa</text><text x="215" y="118" text-anchor="middle" class="t">línea base manual M0</text><text x="215" y="145" text-anchor="middle" class="t">frente al prototipo T1</text></g>
  <g transform="translate(100,540)"><rect width="430" height="180" rx="22" class="eval"/><circle cx="48" cy="48" r="27" class="c3"/><text x="48" y="55" text-anchor="middle" class="n">6</text><text x="215" y="83" text-anchor="middle" class="h">Evaluación y análisis</text><text x="215" y="118" text-anchor="middle" class="t">métricas automáticas, expertos</text><text x="215" y="145" text-anchor="middle" class="t">errores y amenazas a la validez</text></g>
  <path d="M1485 375 V540" class="line"/><path d="M1270 630 H1115" class="line"/><path d="M685 630 H530" class="line"/>

  <rect x="300" y="795" width="1200" height="65" rx="16" fill="#f5f8fb" stroke="#bfd0de" stroke-width="2"/><text x="900" y="834" text-anchor="middle" class="t">Resultado: evidencia para responder los cuatro objetivos sin convertir extensiones opcionales en requisitos del estudio.</text>
</svg>
