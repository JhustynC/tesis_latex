<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 808" role="img" aria-labelledby="trazabilidad_informacion-title trazabilidad_informacion-desc"><title id="trazabilidad_informacion-title">Información, procedencia y trazabilidad</title><desc id="trazabilidad_informacion-desc">Tres pasos ordenados: documentos y decisiones confirmadas producen fragmentos citables; la recuperación aporta evidencia para RF, RNF y HU, que guardan citas y vínculos internos distintos; un control automático verifica enlaces, el analista juzga pertinencia y versiones y corridas conservan el historial.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style><marker id="trazabilidad_informacion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"></polygon></marker><marker id="trazabilidad_informacion-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"></polygon></marker><marker id="trazabilidad_informacion-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"></polygon></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"></rect>
