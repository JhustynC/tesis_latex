<text x="40" y="760" font-family="'Geist', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">source_fragments apunta a evidencia documental o decisiones confirmadas; related_artifacts apunta a otros artefactos.</text>
