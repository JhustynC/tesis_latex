<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3974a8"/></marker>
    <style>
      .title{font:700 34px Arial;fill:#17324d}.sub{font:400 18px Arial;fill:#52687c}
      .layer{fill:#f5f8fb;stroke:#b9cad8;stroke-width:2}.layerTitle{font:700 21px Arial;fill:#17324d}
      .box{fill:#fff;stroke:#3974a8;stroke-width:2.4}.agent{fill:#eef5ff;stroke:#3974a8;stroke-width:2.4}
      .human{fill:#fff7e8;stroke:#c58b24;stroke-width:2.4}.store{fill:#edf8f3;stroke:#3b8b6d;stroke-width:2.4}
      .h{font:700 18px Arial;fill:#17324d}.t{font:400 15px Arial;fill:#334e63}.small{font:400 14px Arial;fill:#52687c}
      .line{stroke:#3974a8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="white"/>
  <text x="900" y="52" text-anchor="middle" class="title">Arquitectura multiagente de ReqLab</text>
  <text x="900" y="82" text-anchor="middle" class="sub">Capas, agentes lógicos, herramientas compartidas y persistencia</text>

  <rect x="55" y="115" width="1690" height="150" rx="18" class="layer"/>
  <text x="82" y="148" class="layerTitle">Presentación</text>
  <rect x="300" y="142" width="270" height="88" rx="14" class="human"/>
  <text x="435" y="175" text-anchor="middle" class="h">Usuario / analista</text><text x="435" y="201" text-anchor="middle" class="t">confirma y revisa decisiones</text>
  <rect x="720" y="142" width="390" height="88" rx="14" class="box"/>
  <text x="915" y="175" text-anchor="middle" class="h">Aplicación web Angular</text><text x="915" y="201" text-anchor="middle" class="t">proyectos · fuentes · definición · revisión</text>
  <rect x="1260" y="142" width="270" height="88" rx="14" class="box"/>
  <text x="1395" y="175" text-anchor="middle" class="h">API FastAPI</text><text x="1395" y="201" text-anchor="middle" class="t">contratos HTTP</text>
  <path d="M570 186 H720" class="line"/><path d="M1110 186 H1260" class="line"/>

  <rect x="55" y="292" width="1690" height="300" rx="18" class="layer"/>
  <text x="82" y="325" class="layerTitle">Aplicación y agentes</text>
  <rect x="120" y="354" width="300" height="92" rx="14" class="box"/><text x="270" y="386" text-anchor="middle" class="h">Servicio de aplicación</text><text x="270" y="412" text-anchor="middle" class="t">orquestación central secuencial</text>
  <rect x="495" y="354" width="270" height="92" rx="14" class="agent"/><text x="630" y="386" text-anchor="middle" class="h">Agente de definición</text><text x="630" y="412" text-anchor="middle" class="t">perfil y preguntas adaptativas</text>
  <rect x="840" y="354" width="190" height="92" rx="14" class="agent"/><text x="935" y="386" text-anchor="middle" class="h">Agente RF</text><text x="935" y="412" text-anchor="middle" class="t">capacidades</text>
  <rect x="1070" y="354" width="190" height="92" rx="14" class="agent"/><text x="1165" y="386" text-anchor="middle" class="h">Agente RNF</text><text x="1165" y="412" text-anchor="middle" class="t">calidad y restricciones</text>
  <rect x="1300" y="354" width="190" height="92" rx="14" class="agent"/><text x="1395" y="386" text-anchor="middle" class="h">Agente HU</text><text x="1395" y="412" text-anchor="middle" class="t">actor, objetivo y valor</text>
  <rect x="520" y="482" width="330" height="82" rx="14" class="agent"/><text x="685" y="512" text-anchor="middle" class="h">Trazabilidad y consistencia</text><text x="685" y="537" text-anchor="middle" class="t">validación determinista y alertas</text>
  <rect x="980" y="482" width="280" height="82" rx="14" class="agent"/><text x="1120" y="512" text-anchor="middle" class="h">Agente de revisión</text><text x="1120" y="537" text-anchor="middle" class="t">propuesta con aprobación humana</text>
  <path d="M1395 230 V280 H270 V354" class="line"/><path d="M420 400 H495" class="line"/><path d="M765 400 H840" class="line"/><path d="M1030 400 H1070" class="line"/><path d="M1260 400 H1300" class="line"/><path d="M1395 446 V523 H1260" class="line"/><path d="M980 523 H850" class="line"/>

  <rect x="55" y="620" width="1690" height="170" rx="18" class="layer"/>
  <text x="82" y="653" class="layerTitle">Servicios compartidos</text>
  <rect x="150" y="678" width="330" height="82" rx="14" class="box"/><text x="315" y="708" text-anchor="middle" class="h">Extracción y segmentación</text><text x="315" y="733" text-anchor="middle" class="t">PDF · DOCX · TXT · MD · texto libre</text>
  <rect x="570" y="678" width="360" height="82" rx="14" class="box"/><text x="750" y="708" text-anchor="middle" class="h">Recuperación híbrida</text><text x="750" y="733" text-anchor="middle" class="t">TF–IDF + embeddings + RRF + reranker</text>
  <rect x="1020" y="678" width="300" height="82" rx="14" class="box"/><text x="1170" y="708" text-anchor="middle" class="h">Cliente LLM validado</text><text x="1170" y="733" text-anchor="middle" class="t">DeepSeek · Pydantic · reintentos</text>
  <rect x="1410" y="678" width="250" height="82" rx="14" class="box"/><text x="1535" y="708" text-anchor="middle" class="h">Exportadores</text><text x="1535" y="733" text-anchor="middle" class="t">JSON · DOCX</text>
  <path d="M630 446 V620" class="line"/><path d="M935 446 V620" class="line"/><path d="M1165 446 V620" class="line"/><path d="M1395 446 V620" class="line"/>

  <rect x="55" y="818" width="1690" height="165" rx="18" class="layer"/>
  <text x="82" y="851" class="layerTitle">Persistencia local</text>
  <rect x="210" y="878" width="350" height="72" rx="14" class="store"/><text x="385" y="906" text-anchor="middle" class="h">SQLite</text><text x="385" y="931" text-anchor="middle" class="t">proyectos · artefactos · versiones · runs</text>
  <rect x="725" y="878" width="350" height="72" rx="14" class="store"/><text x="900" y="906" text-anchor="middle" class="h">ChromaDB</text><text x="900" y="931" text-anchor="middle" class="t">índice vectorial por proyecto</text>
  <rect x="1240" y="878" width="350" height="72" rx="14" class="store"/><text x="1415" y="906" text-anchor="middle" class="h">Sistema de archivos</text><text x="1415" y="931" text-anchor="middle" class="t">originales · modelos · exportaciones</text>
  <path d="M315 760 V818" class="line"/><path d="M750 760 V818" class="line"/><path d="M1535 760 V818" class="line"/>
</svg>
