<text x="40" y="74" font-family="'Geist', sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">Secuencia completa de preparación, transformación y control de los artefactos</text>

<text x="56" y="114" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="start">A · PREPARACIÓN CONTEXTUAL</text>
<text x="56" y="134" font-family="'Geist', sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">la definición confirmada condiciona toda la generación</text>

<text x="56" y="286" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="start">B · TRANSFORMACIÓN AUTOMÁTICA — SEIS ETAPAS DEL OBJETIVO ESPECÍFICO 2</text>
<text x="56" y="306" font-family="'Geist', sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">todos los artefactos conservan citas y pasan por los mismos controles</text>

<text x="56" y="562" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="start">C · CONTROL HUMANO Y ENTREGA</text>
